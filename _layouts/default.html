<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="description" content="{{ page.description | default: 'The Gadfly is Laurel Heights\' best, worst, and only satire newspaper.' }}">
        <meta name="keywords" content="Laurel Heights, LHSS, satire, student newspaper, Waterloo, newspaper, the gadfly, gadfly, news, The Gadfly archives">
        <meta property="og:title" content="{{ page.title }} | The Gadfly">
        <meta property="og:image" content="{{ '/assets/misc/gadfly.png' | relative_url }}">
        <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
        <meta property="og:url" content="{{ page.url | absolute_url }}">
        <meta property="og:type" content="article">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="theme-color" content="#09461d">
        <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
        <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png">
        <title>{{ page.title }} | The Gadfly</title>
    </head>
    <body>
        {% include header.html %}

        <main>
            {{ content }}
        </main>
        
        <div class="newsletter-signup">
            <h3>Stay Updated</h3>
            <p>Get notified when new issues are published</p>
            <form action="https://buttondown.com/api/emails/embed-subscribe/thegadfly" method="post" target="popupwindow" onsubmit="window.open('https://buttondown.com/thegadfly', 'popupwindow')" class="embeddable-buttondown-form">
                <input type="email" name="email" id="bd-email" placeholder="Enter your email" required>
                <button type="submit">Subscribe</button>
            </form>
        </div>
        {% include footer.html %}
        <script src="{{ '/js/main.js' | relative_url }}"></script>
        </body>
</html>
