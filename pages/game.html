<style>
.game-wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
    text-align: center;
}
.game-wrap h1 { color: var(--gadfly-green); margin-bottom: 0.25rem; }
.game-wrap .intro-text { color: #666; margin-bottom: 1.5rem; }
.game-shell {
    background: #0b130c;
    border: 3px solid var(--gadfly-green);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 1px 1px 10px;
    line-height: 0;
}
#gadfly-game {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 6px;
    touch-action: none;        /* stop page scroll while dragging the paddle */
    cursor: pointer;
}
.game-controls {
    margin-top: 1rem;
    color: #555;
    font-size: 0.9rem;
    line-height: 1.6;
}
.game-controls kbd {
    background: var(--gadfly-green);
    color: var(--off-white);
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 0.85rem;
}
</style>

<section class="content-section game-wrap">
    <h1>Break the Gadfly</h1>
    <p class="intro-text">The bricks are us. You can break us!? Idk man.</p>

    <div class="game-shell">
        <canvas id="gadfly-game" width="760" height="520"
                aria-label="Brick breaker game where the bricks are author photos"></canvas>
    </div>

    <p class="game-controls">
        Move with your <strong>mouse</strong>, <strong>finger</strong>, or
        <kbd>←</kbd> <kbd>→</kbd>. Launch / restart with <kbd>click</kbd> or <kbd>space</kbd>.
    </p>
</section>
